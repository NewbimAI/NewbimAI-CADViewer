name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# pull_request_target 默认拿不到写权限，这里显式给：
# 评论、更新 status、把签名写进仓库都要用。
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    steps:
      # 只处理两种事件：PR 生命周期变化，或贡献者在 PR 里回复签名口令 / recheck。
      # 用 pull_request_target 而不是 pull_request：fork 来的 PR 也能拿到写权限来留评论。
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event_name == 'issue_comment' &&
           (github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        # 上游已 archived，故钉死 commit，不用浮动 tag
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          # 签名存在本仓库，GITHUB_TOKEN 足够，不需要 PAT
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/NewbimAI/NewbimAI-CADViewer/blob/main/CLA.md'
          # 签名提交到这个分支（该分支不要设保护，否则 bot 写不进去）
          branch: 'main'
          allowlist: 'NewbimAI,dependabot[bot],github-actions[bot]'
          lock-pullrequest-aftermerge: false
          create-file-commit-message: 'chore(cla): 创建 CLA 签名记录文件'
          signed-commit-message: 'chore(cla): $contributorName 签署 CLA（$owner/$repo#$pullRequestNo）'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: |
            感谢你的贡献！合并前需要先签署 [CLA](https://github.com/NewbimAI/NewbimAI-CADViewer/blob/main/CLA.md)。

            本项目以 **AGPL-3.0-only** 开源，同时对无法遵守 AGPL 义务的企业提供**商业许可**；
            为了同一份贡献能同时用于这两种授权，需要你对贡献授予再许可权。

            签署方式：在本 PR 里直接回复下面这句话（原样复制，一字不改）：

            > I have read the CLA Document and I hereby sign the CLA

            签完如果状态还没变，回复 `recheck` 重新检查。签名会记录到 `signatures/version1/cla.json`。
          custom-allsigned-prcomment: '**CLA Assistant Lite bot**：本 PR 的所有贡献者均已签署 CLA。'
